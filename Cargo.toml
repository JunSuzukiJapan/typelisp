[package]
name = "typelisp"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.8.0"
num-bigint = "0.4"
rustyline = "18"
inkwell = { version = "0.9", features = ["llvm17-0"] }

[[bin]]
name = "typl"
path = "src/main.rs"
