[package]
name = "typelisp"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/typelisp-mem", "crates/typelisp-rt"]
# Plain `cargo build`/`cargo test` (no `-p`) only builds the root package by
# default in a non-virtual workspace like this one — that's not enough to
# produce `typelisp-rt`'s `staticlib` artifact, since the root package only
# needs its `rlib` to link against. Listing every member here makes them
# explicit build targets too, the same as passing `-p typelisp-rt` — see
# `aot.rs`'s `staticlib_path` doc comment for why that artifact has to exist
# before any AOT test runs.
default-members = [".", "crates/typelisp-mem", "crates/typelisp-rt"]

[dependencies]
once_cell = "1.8.0"
# `serde` feature: fasl (compiled-module) serialization — see `src/fasl.rs`.
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rustyline = "18"
inkwell = { version = "0.9", features = ["llvm17-0"] }
typelisp-mem = { path = "crates/typelisp-mem", features = ["serde"] }
typelisp-rt = { path = "crates/typelisp-rt" }
lsp-server = "0.8"
lsp-types = "0.97"
# `rc`: `Loc.file` is an `Rc<str>` (see `typelisp-mem`'s `errors.rs`).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[[bin]]
name = "typl"
path = "src/main.rs"

[[bin]]
name = "typl-lsp"
path = "src/bin/lsp.rs"
