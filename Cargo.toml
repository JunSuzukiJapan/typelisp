[package]
name = "typelisp"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# The native compiler (LLVM via inkwell) is opt-in; the core read/eval/GC path
# builds and tests without any LLVM toolchain installed.
default = []
compile = ["inkwell"]

[dependencies]
once_cell = "1.8.0"
num-bigint = "0.4"
rustyline = "18"
# llvm17-0 matches `brew install llvm@17` (inkwell 0.9.0's newest supported LLVM;
# inkwell does not yet support LLVM 18+, see docs/TODO.md build notes).
inkwell = { version = "0.9", features = ["llvm17-0"], optional = true }

[[bin]]
name = "typl"
path = "src/main.rs"
