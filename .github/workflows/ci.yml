# Every push and pull request: the workspace builds, and nothing in it — tests
# included — has a warning. The test suite itself runs only for a release
# (release.yml): it takes hours, serially (scripts/test-serial.sh says why).
#
# Tests are checked, not built: linked, the 130-odd test binaries come to more
# than 15 GB, more than a hosted runner has free.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain this repository is developed with. Pinned so that a new
  # stable's new lints do not fail a commit that changed nothing.
  RUST_VERSION: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          rust-version: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings are errors)
        run: cargo check --workspace --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Build
        run: cargo build --workspace --locked

  linux:
    name: Linux (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            apt-suite: noble
          - distro: debian-13
            image: debian:13
            apt-suite: trixie
          - distro: fedora-44
            image: fedora:44
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball and
      # leaves no repository behind.
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
          else
            dnf install -y git
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          rust-version: ${{ env.RUST_VERSION }}
          apt-suite: ${{ matrix.apt-suite }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - name: Check (warnings are errors)
        run: cargo check --workspace --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Build
        run: cargo build --workspace --locked
