# Every push and pull request: the workspace builds, nothing in it — tests
# included — has a warning, and every translation is up to date with the
# Japanese document it was made from. The test suite itself runs only for a
# release (release.yml): it takes hours even with the binaries run in
# parallel (scripts/test-parallel.sh).
#
# Tests are checked, not built: linked, the 130-odd test binaries come to more
# than 15 GB, more than a hosted runner has free.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain this repository is developed with. Pinned so that a new
  # stable's new lints do not fail a commit that changed nothing.
  RUST_VERSION: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      # The whole history: each translation names the commit it was made
      # from, and the check compares its source against that commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check
        run: scripts/check-translations.sh

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          rust-version: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings are errors)
        run: cargo check --workspace --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      # The runtime as `typl -c --target wasm32-wasip1` links it: what is left
      # out there (the sockets, TLS) must leave nothing behind that warns.
      - name: Check the wasm32-wasip1 runtime (warnings are errors)
        run: cargo check -p typelisp-front --target wasm32-wasip1 --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Check the wasm32-unknown-unknown runtime (warnings are errors)
        run: cargo check -p typelisp-front --target wasm32-unknown-unknown --locked
        env:
          RUSTFLAGS: -D warnings
      # The runtime for a board without an operating system, without std:
      # with the host functions over semihosting (what the tests run under
      # QEMU with), and without them (a board that gives its own).
      - name: Check the boards' runtimes (warnings are errors)
        run: |
          for target in thumbv7em-none-eabihf thumbv8m.main-none-eabihf riscv32imac-unknown-none-elf; do
            cargo check -p typelisp-rt-embedded --target "$target" --locked
            cargo check -p typelisp-rt-semihosting --target "$target" --locked
          done
        env:
          RUSTFLAGS: -D warnings
      - name: Build
        run: cargo build --workspace --locked

  linux:
    name: Linux (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            apt-suite: noble
          - distro: debian-13
            image: debian:13
            apt-suite: trixie
          - distro: fedora-44
            image: fedora:44
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball and
      # leaves no repository behind.
      - name: Install git
        run: |
          # Three tries, as in setup-build: a runner's network fails now and then.
          retry() { for i in 1 2 3; do "$@" && return 0; if [ "$i" -lt 3 ]; then echo "retrying in $((i * 20))s: $*" >&2; sleep $((i * 20)); fi; done; return 1; }
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            retry apt-get update
            retry apt-get install -y --no-install-recommends ca-certificates git
          else
            retry dnf install -y git
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          rust-version: ${{ env.RUST_VERSION }}
          apt-suite: ${{ matrix.apt-suite }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - name: Check (warnings are errors)
        run: cargo check --workspace --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      # The runtime as `typl -c --target wasm32-wasip1` links it: what is left
      # out there (the sockets, TLS) must leave nothing behind that warns.
      - name: Check the wasm32-wasip1 runtime (warnings are errors)
        run: cargo check -p typelisp-front --target wasm32-wasip1 --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Check the wasm32-unknown-unknown runtime (warnings are errors)
        run: cargo check -p typelisp-front --target wasm32-unknown-unknown --locked
        env:
          RUSTFLAGS: -D warnings
      # The runtime for a board without an operating system, without std:
      # with the host functions over semihosting (what the tests run under
      # QEMU with), and without them (a board that gives its own).
      - name: Check the boards' runtimes (warnings are errors)
        run: |
          for target in thumbv7em-none-eabihf thumbv8m.main-none-eabihf riscv32imac-unknown-none-elf; do
            cargo check -p typelisp-rt-embedded --target "$target" --locked
            cargo check -p typelisp-rt-semihosting --target "$target" --locked
          done
        env:
          RUSTFLAGS: -D warnings
      - name: Build
        run: cargo build --workspace --locked
