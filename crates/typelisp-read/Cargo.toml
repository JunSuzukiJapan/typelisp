[package]
name = "typelisp-read"
description = "Common Lisp style reader of typelisp. Internal crate of typelisp; not meant to be used directly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lisp", "typelisp"]
categories = ["compilers"]

# The CL reader, as its own crate rather than a module of `typelisp`, for the
# same reason `typelisp-print` is one: a compiled function that calls `read`
# has to name a shim, and the shim cannot reach up into a crate that depends
# on the runtime. Below the checker and the interpreter, which is where the
# reader has always sat conceptually — it turns text into `Value`s and knows
# nothing about types.
[lib]
name = "typelisp_read"

[dependencies]
# `#xFF`/`1/3` and the bignum overflow path.
num-bigint = "0.4"
num-rational = "0.4"
typelisp-abi.workspace = true
typelisp-mem.workspace = true
