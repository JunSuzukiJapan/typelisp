[package]
name = "typelisp-mem"
version = "0.0.1"
edition = "2018"

[lib]
name = "typelisp_mem"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
# Optional: `Loc` serialization for the root crate's fasl (compiled-module)
# format. Off by default so `typelisp-rt`'s AOT `staticlib` doesn't grow —
# only the root `typelisp` crate turns it on.
serde = { version = "1", features = ["derive", "rc"], optional = true }

[features]
serde = ["dep:serde"]
