[package]
name = "typelisp-rt"
description = "Runtime library that typelisp's compiled programs link. Internal crate of typelisp; not meant to be used directly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lisp", "typelisp"]
categories = ["compilers"]

# `rlib` only. These `#[no_mangle]` shims still have to reach an AOT
# executable as ordinary linker symbols, but `cc` takes one archive and this
# crate is not the top of the stack any more: `typelisp-front` sits above it
# and its `staticlib` carries these objects along. Two staticlibs would just
# be a second copy nobody links.
[lib]
name = "typelisp_rt"
crate-type = ["rlib"]

[dependencies]
typelisp-abi.workspace = true
typelisp-mem.workspace = true
typelisp-print.workspace = true
typelisp-read.workspace = true
num-bigint = { version = "0.4", default-features = false }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
num-integer = { version = "0.1", default-features = false }
# `std` (on by default) builds the crates below over an operating system's
# `std`. Without it (a microcontroller) every one is `no_std` + `alloc`, and
# the board provides what the host layer asks of the machine
# (`typelisp_mem::host`). What only some targets have at all is in
# `typelisp-rt-sys` and `typelisp-rt-posix`, not behind this feature.
[features]
default = ["std"]
std = [
    "typelisp-abi/std", "typelisp-mem/std", "typelisp-print/std", "typelisp-read/std",
    "num-bigint/std", "num-rational/std", "num-traits/std", "num-integer/std",
]
