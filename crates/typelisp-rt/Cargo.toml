[package]
name = "typelisp-rt"
version = "0.0.2"
edition = "2021"

# `staticlib` lets `compile-file`'s AOT output (linked via the system `cc`,
# see `typelisp::compile::aot::write_executable`) resolve these `#[no_mangle]`
# functions as ordinary linker symbols. `rlib` stays too, since the main
# `typelisp` crate links against this the normal Rust way for its JIT path.
[lib]
name = "typelisp_rt"
crate-type = ["rlib", "staticlib"]

[dependencies]
typelisp-abi = { path = "../typelisp-abi" }
typelisp-mem = { path = "../typelisp-mem" }
typelisp-print = { path = "../typelisp-print" }
typelisp-read = { path = "../typelisp-read" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
