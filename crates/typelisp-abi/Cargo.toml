[package]
name = "typelisp-abi"
description = "Calling convention shared by typelisp's compiled code and its runtime. Internal crate of typelisp; not meant to be used directly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lisp", "typelisp"]
categories = ["compilers"]

# The compiled-code calling convention, below every crate that defines `rt_*`
# shims (`typelisp-rt`, `typelisp-print`). See the crate doc comment for why
# it is not simply part of `typelisp-rt`.
[lib]
name = "typelisp_abi"

[dependencies]
typelisp-mem.workspace = true
