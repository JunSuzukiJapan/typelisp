[package]
name = "typelisp-front"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"

# The front end of the language: reader glue, type checker, interpreter,
# module loader, and the prelude source. Everything here is about *typelisp
# programs*; nothing here knows what LLVM is.
#
# It is a crate and not a module of `typelisp` for the same reason
# `typelisp-print` and `typelisp-read` are: the linker pulls a static archive
# by member, and only a crate boundary guarantees that a program which never
# calls `eval` does not pay for the checker. `staticlib` is here rather than on
# `typelisp-rt` because this crate sits *above* it — one archive has to hold
# both, and it has to be the outer one.
[lib]
name = "typelisp_front"
crate-type = ["rlib", "staticlib"]

[dependencies]
typelisp-abi = { path = "../typelisp-abi" }
typelisp-mem = { path = "../typelisp-mem" }
typelisp-print = { path = "../typelisp-print" }
typelisp-read = { path = "../typelisp-read" }
typelisp-rt = { path = "../typelisp-rt" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
# `expect_str` returns `typelisp_mem::Heap::string`'s mapped read-guard type
# unchanged — see `typelisp-mem`'s own `parking_lot` dependency note.
parking_lot = "0.12"
# The AOT `eval` environment's checked-state snapshot (`snapshot.rs`): what
# `compile-file` writes into the executable so its startup does not have to
# re-read and re-check the prelude and the program's own source.
#
# `bincode` and not `serde_json`: the deleted fasl format was JSON and measured
# 2,499,193 bytes for 2,383 lines of source, of which ~17ms of a 24.6ms load was
# the JSON parse alone. A snapshot is machine-to-machine and never read by a
# person, so there is nothing the text form buys back. It also lets a map be
# keyed by something other than a string, which `DefLocs`/`Docs` need.
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
