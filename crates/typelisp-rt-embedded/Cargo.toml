[package]
name = "typelisp-rt-embedded"
description = "The runtime typelisp links an executable for a board without an operating system with. Internal crate of typelisp; not meant to be used directly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lisp", "typelisp"]
categories = ["compilers"]

# What every target has (`typelisp-rt` and the crates below it), as one
# static library, without std: the board gives memory, output and time
# through the `typelisp_host_*` C functions (`typelisp_mem::host::board`).
# This library gives the allocator's and the start of the program; the rest
# the board gives as C functions, or `typelisp-rt-semihosting`, which is this
# library with them over semihosting.
#
# Only for a target without an operating system does it have dependencies or
# anything in it; elsewhere (the host, when the whole workspace is built) it
# is an empty library. A member of the workspace but not a default member;
# built for each embedded target by scripts/build-embedded-runtime.sh, and by
# build.rs for a `typl` with the feature `embedded`. An `rlib` as well, so
# that `typelisp` can depend on it, which is what lets that build name it
# with `-p`.
[lib]
name = "typelisp_rt_embedded"
crate-type = ["staticlib", "rlib"]

[target.'cfg(target_os = "none")'.dependencies]
typelisp-abi.workspace = true
typelisp-mem.workspace = true
typelisp-print.workspace = true
typelisp-read.workspace = true
typelisp-rt.workspace = true
# The memory the runtime allocates from, on every core.
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

# An Arm Cortex-M core (src/cortex_m.rs): the start of the program (the
# vector table, `Reset`, the linker script `link.x`), the NVIC, and the one
# core's critical section the allocator takes.
[target.'cfg(all(target_os = "none", target_arch = "arm"))'.dependencies]
cortex-m-rt = "0.7.7"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }

# A 32-bit RISC-V core (src/riscv.rs): the start of the program (`_start`,
# the trap entry, the linker script `link.x`, which includes `memory.x`), and
# the one hart's critical section the allocator takes. The traps are
# dispatched here (`custom-interrupts`, `custom-exceptions`); one hart runs
# the program.
[target.'cfg(all(target_os = "none", target_arch = "riscv32"))'.dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "custom-interrupts", "custom-exceptions", "single-hart"] }
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }
